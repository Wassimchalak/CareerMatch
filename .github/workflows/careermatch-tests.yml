name: CareerMatch .NET test suite
on:
  push:
    paths:
      - 'CareerMatch.API/**'
      - 'CareerMatch.API.Tests/**'
      - '.github/workflows/careermatch-tests.yml'
  pull_request:
    paths:
      - 'CareerMatch.API/**'
      - 'CareerMatch.API.Tests/**'
      - '.github/workflows/careermatch-tests.yml'
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CareerMatch.API.Tests/CareerMatch.API.Tests.csproj
      - name: Test with results and coverage
        run: dotnet test CareerMatch.API.Tests/CareerMatch.API.Tests.csproj --no-restore --configuration Release --filter 'Category!=SqlIntegration' --logger 'trx;LogFileName=careermatch-tests.trx' --collect:'XPlat Code Coverage'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careermatch-backend-test-results
          path: |
            **/TestResults/**

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CareerMatch.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CareerMatch.Frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and production build
        run: npm run build
      - name: Lint source
        run: npm run lint
      - name: Report production dependency advisories (nonblocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  sql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "C4reerMatch_Test_Only!2026"
        ports:
          - 14333:1433
    env:
      CAREERMATCH_SQL_INTEGRATION_ENABLED: "true"
      CAREERMATCH_TEST_SQL_CONNECTION: "Server=127.0.0.1,14333;Database=CareerMatchIntegrationTests;User Id=sa;Password=C4reerMatch_Test_Only!2026;Encrypt=False;TrustServerCertificate=True;Connect Timeout=3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CareerMatch.API.Tests/CareerMatch.API.Tests.csproj
      - name: Test actual Dapper queries on disposable SQL Server
        run: dotnet test CareerMatch.API.Tests/CareerMatch.API.Tests.csproj --no-restore --configuration Release --filter 'Category=SqlIntegration' --logger 'trx;LogFileName=careermatch-sql-tests.trx'
      - name: Upload SQL regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careermatch-sql-test-results
          path: |
            **/TestResults/**
